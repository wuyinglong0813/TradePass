tradepass:
  dev:
    enabled: false
  demo-data:
    enabled: false
  # 正式环境禁用体验账号特权初始化，旧体验环境变量不再启用该功能。
  experience-test-accounts:
    enabled: false
  # 生产及云托管开发版默认使用真实认证链路；仅显式开启时使用旧模拟链路。
  ca:
    mock-enabled: ${TRADEPASS_CA_MOCK_ENABLED:false}
  storage:
    enabled: ${TRADEPASS_STORAGE_ENABLED:true}
    required: true
    migrate-legacy-blobs: ${TRADEPASS_STORAGE_MIGRATE_LEGACY_BLOBS:false}
    bucket: ${CLOUDBASE_STORAGE_BUCKET:7072-prod-d7g9zrn5s7e6aab68-1446724178}
    region: ${CLOUDBASE_STORAGE_REGION:ap-shanghai}
    key-prefix: ${TRADEPASS_STORAGE_KEY_PREFIX:prod}

wechat:
  cloud-open-api-enabled: ${WECHAT_CLOUD_OPEN_API_ENABLED:true}
