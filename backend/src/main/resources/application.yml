server:
  port: 9999

wechat:
  app-id: ${WECHAT_APP_ID:wxd6d1e93a3868253e}
  app-secret: ${WECHAT_APP_SECRET:}

tradepass:
  dev:
    enabled: ${TRADEPASS_DEV_ENABLED:false}
  demo-data:
    enabled: ${TRADEPASS_DEMO_DATA_ENABLED:false}
  migration:
    allow-destructive-v5: ${TRADEPASS_ALLOW_DESTRUCTIVE_V5:false}
  auth:
    session-hours: ${TRADEPASS_SESSION_HOURS:168}
  verification:
    auto-approve: ${TRADEPASS_VERIFICATION_AUTO_APPROVE:false}
    callback-token: ${TRADEPASS_VERIFICATION_CALLBACK_TOKEN:}
  redis:
    enabled: ${TRADEPASS_REDIS_ENABLED:true}
    key-prefix: ${TRADEPASS_REDIS_KEY_PREFIX:tradepass}
    auth-cache-ttl: ${TRADEPASS_REDIS_AUTH_CACHE_TTL:60s}
    ranking-cache-ttl: ${TRADEPASS_REDIS_RANKING_CACHE_TTL:30s}
    wechat-local-cache-ttl: ${TRADEPASS_REDIS_WECHAT_LOCAL_CACHE_TTL:5m}
  oss:
    enabled: ${TRADEPASS_OSS_ENABLED:false}
    required: ${TRADEPASS_OSS_REQUIRED:false}
    migrate-legacy-blobs: ${TRADEPASS_OSS_MIGRATE_LEGACY_BLOBS:false}
    endpoint: ${OSS_ENDPOINT:}
    bucket: ${OSS_BUCKET:}
    access-key-id: ${OSS_ACCESS_KEY_ID:}
    access-key-secret: ${OSS_ACCESS_KEY_SECRET:}
    security-token: ${OSS_SECURITY_TOKEN:}
    server-side-encryption: ${OSS_SERVER_SIDE_ENCRYPTION:AES256}
    kms-key-id: ${OSS_KMS_KEY_ID:}
    key-prefix: ${TRADEPASS_OSS_KEY_PREFIX:tradepass}
    connection-timeout-millis: ${OSS_CONNECTION_TIMEOUT_MILLIS:5000}
    socket-timeout-millis: ${OSS_SOCKET_TIMEOUT_MILLIS:30000}

spring:
  application:
    name: tradepass
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:1119}
      password: ${REDIS_PASSWORD:}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:1s}
      timeout: ${REDIS_TIMEOUT:1s}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:1118}/tradepass?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    username: ${DB_USERNAME:tradepass}
    password: ${DB_PASSWORD:tradepass_pwd}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
